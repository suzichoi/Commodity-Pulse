name: Update Commodity Data & Deploy

on:
  schedule:
    # 매 1시간마다 정각에 자동 실행 (Hourly cron)
    - cron: '0 * * * *'
  # GitHub Actions 탭에서 수동 즉시 실행 가능 (Manual trigger)
  workflow_dispatch:

# 리포지토리 파일 쓰기(Push) 및 GitHub Pages 배포 권한 설정
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch Latest Commodity Market Data
        run: |
          python scripts/fetch_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/commodities.json app.js
          if [ -f commodities.json ]; then git add commodities.json; fi
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            CURRENT_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')
            git commit -m "chore(data): auto update commodity prices and report [${CURRENT_TIME}]"
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
